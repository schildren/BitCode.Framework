apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-api
spec:
  # dev: sin picos de carga reales que justificar, el piso coincide con el `replicas` fijo del
  # deployment-patch (1) -- estos valores son los mismos que ya trae base/hpa.yaml, repetidos acá
  # de forma explícita (mismo criterio que deployment-patch.yaml: declarar la intención por ambiente
  # en vez de heredar en silencio el default de base).
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bitcode-sample-api-dev

labels:
  - pairs:
      environment: dev
    includeSelectors: false

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml

images:
  # Ambiente de desarrollo: tag mutable de pre-release, se re-despliega seguido.
  - name: bitcode/sample-api
    newTag: dev

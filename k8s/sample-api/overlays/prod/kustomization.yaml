apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - namespace.yaml

namespace: bitcode-sample-api-prod

labels:
  - pairs:
      environment: prod
    includeSelectors: false

patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
  - path: pdb-patch.yaml

images:
  # Producción: SIEMPRE un tag inmutable versionado (SemVer real de release),
  # nunca "latest" ni un tag mutable -- reemplazar por el valor real de cada
  # release antes de aplicar. No se deja "latest" como default para no
  # habilitar por accidente un despliegue no reproducible en prod.
  - name: bitcode/sample-api
    newTag: "0.1.0"

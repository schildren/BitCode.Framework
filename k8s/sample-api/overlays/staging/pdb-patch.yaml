apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sample-api
spec:
  # staging: minReplicas 2 (ver deployment-patch.yaml / hpa-patch.yaml) -- maxUnavailable:1 garantiza
  # que, durante una disrupción voluntaria (drain, upgrade), al menos 1 de las 2 réplicas siga
  # disponible en todo momento (ver el comentario completo en base/pdb.yaml). Mismo valor NUMÉRICO que
  # dev, pero con un piso de réplicas mayor ya lo vuelve más estricto en la práctica.
  maxUnavailable: 1

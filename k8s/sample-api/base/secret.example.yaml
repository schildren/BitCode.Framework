# PLANTILLA -- NO es un recurso real, no se referencia desde kustomization.yaml
# y no se aplica con `kubectl apply -k`. Documenta las claves que
# k8s/sample-api/base/deployment.yaml espera encontrar en el Secret
# "sample-api-secrets" de cada namespace/ambiente, provisionado por un
# mecanismo externo al repositorio (nunca committeado con valores reales --
# Plan Maestro sección 3.2, "guardar secretos en el repositorio" está
# explícitamente prohibido):
#
#   - Un operador de sincronización de secretos (p. ej. External Secrets
#     Operator) que lo puebla desde HashiCorp Vault
#     (docs/adr/0014-secretos-proveedor-vault-propuesto.md), o
#   - El pipeline de despliegue de cada ambiente, con acceso al secret store
#     real, que crea/actualiza el Secret directamente antes de aplicar estos
#     manifiestos (kubectl create secret / sealed-secrets / etc.).
#
# Claves esperadas por el Deployment (envFrom -> secretRef: sample-api-secrets):
apiVersion: v1
kind: Secret
metadata:
  name: sample-api-secrets
type: Opaque
stringData:
  ConnectionStrings__Default: "<provisto externamente -- cadena de conexión a SQL Server del ambiente>"
  # Solo si el ConfigMap de este ambiente fija Secrets__Provider=Vault (ver
  # docs/guia-secret-provider.md):
  Secrets__Vault__Token: "<provisto externamente>"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  labels:
    app.kubernetes.io/name: sample-api
    app.kubernetes.io/part-of: bitcode-framework
spec:
  # replicas se fija por overlay de ambiente (dev/staging/prod), no acá — ver
  # kustomization.yaml de cada overlay (patch de "replicas").
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-api
        app.kubernetes.io/part-of: bitcode-framework
    spec:
      # F4-03 (Stateless): sin volúmenes de estado local requeridos, sin
      # affinity a un nodo específico — cualquier pod es reemplazable.
      containers:
        - name: sample-api
          # El tag real se fija por overlay vía kustomization.yaml -> images:
          # (dev/staging apuntan a un tag mutable de pre-release, prod exige
          # un tag inmutable versionado — ver overlays/prod/kustomization.yaml).
          image: bitcode/sample-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            # Configuración no sensible (ASPNETCORE_ENVIRONMENT, logging, etc.).
            - configMapRef:
                name: sample-api-config
            # Referencia externa: el Secret "sample-api-secrets" (cadena de
            # conexión SQL Server, Secrets:Vault:Token si aplica, etc.) NO se
            # define en este repositorio. Lo provisiona cada clúster/ambiente
            # por su propio mecanismo (External Secrets Operator contra Vault
            # -- docs/adr/0014-secretos-proveedor-vault-propuesto.md --, o
            # sealed-secrets/CI en un pipeline de despliegue con acceso al
            # secret store real). Ver overlays/*/secret.example.yaml para las
            # claves esperadas (plantilla, sin valores reales, no se aplica).
            - secretRef:
                name: sample-api-secrets
          # -----------------------------------------------------------------
          # TODO(F4-04): startupProbe / livenessProbe / readinessProbe.
          # Sample.Api todavía no expone endpoints de health/readiness (fila
          # F4-04 del backlog, fuera de alcance de F4-02). No se declara un
          # probe HTTP contra un endpoint inexistente porque eso rompería el
          # pod al desplegar (bucle de reinicio) en vez de solo documentar la
          # brecha. Cuando F4-04 agregue los endpoints, completar acá.
          # -----------------------------------------------------------------
          # TODO(F4-05): preStop hook / terminationGracePeriodSeconds ajustado
          # para drenar tráfico y detener consumers correctamente (fila F4-05,
          # fuera de alcance de F4-02).
          resources:
            # Valores base conservadores; cada overlay los sobreescribe con un
            # patch acorde al perfil de carga esperado del ambiente.
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            # La imagen base ya corre non-root (UID 1654, ver
            # docs/politica-contenedores.md sección 3.4); se refuerza acá a
            # nivel Pod/Container para que el Deployment sea explícito y no
            # dependa únicamente de lo que defina la imagen.
            runAsNonRoot: true
            runAsUser: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # dotnet publish self-contained=false escribe en /tmp; revisar al habilitar F4-04/F4-05 si se puede endurecer.
            capabilities:
              drop:
                - ALL
      # -------------------------------------------------------------------
      # TODO(F4-07): topologySpreadConstraints / afinidad anti-afinidad entre
      # zonas y nodos (fila F4-07, PDB y spread), fuera de alcance de F4-02.
      # -------------------------------------------------------------------
      securityContext:
        seccompProfile:
          type: RuntimeDefault

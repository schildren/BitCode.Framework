apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  labels:
    app.kubernetes.io/name: sample-api
    app.kubernetes.io/part-of: bitcode-framework
spec:
  # replicas se fija por overlay de ambiente (dev/staging/prod), no acá — ver
  # kustomization.yaml de cada overlay (patch de "replicas").
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-api
        app.kubernetes.io/part-of: bitcode-framework
    spec:
      # F4-03 (Stateless): sin volúmenes de estado local requeridos, sin
      # affinity a un nodo específico — cualquier pod es reemplazable.
      # F4-05 (Shutdown): presupuesto de apagado prolijo = preStop sleep (10s, ver
      # lifecycle.preStop más abajo) + margen real para drenar trabajo en curso antes del SIGKILL final:
      #   - Requests HTTP en vuelo: ASP.NET Core/Kestrel ya maneja el drenado por defecto al recibir
      #     SIGTERM (IHostApplicationLifetime.ApplicationStopping), acotado por HostOptions.ShutdownTimeout
      #     (5s por defecto del host genérico si el proyecto consumidor no lo cambia).
      #   - Jobs de Quartz en curso: AddSharedBackgroundJobs (Shared.Infrastructure.BackgroundJobs) ya
      #     registra AddQuartzHostedService con WaitForJobsToComplete=true — pero esa espera también está
      #     acotada por el mismo HostOptions.ShutdownTimeout del host.
      #   - OutboxPublisherBackgroundService / loop de KafkaEventConsumer<TEvent> (Fase 3): ya respetan
      #     el CancellationToken de shutdown fila por fila / mensaje por mensaje (no hay lote a medio
      #     confirmar que se pierda), pero terminar la fila/mensaje EN CURSO también compite por el mismo
      #     presupuesto de HostOptions.ShutdownTimeout.
      # Este Deployment base (sample-api) no registra hoy ningún consumer/Outbox/Quartz (ver
      # docs/politica-manifiestos-kubernetes.md sección "F4-05"), así que 40s alcanza de sobra para
      # requests HTTP. Un proyecto real que SÍ registre trabajo en segundo plano de vida más larga debe
      # (a) subir este valor y (b) subir HostOptions.ShutdownTimeout en su propio Program.cs
      # (`builder.Host.ConfigureHostOptions(o => o.ShutdownTimeout = ...)`) para que el default de 5s no
      # corte ese trabajo antes de que este mayor presupuesto del Pod expire — ver la guía referenciada.
      terminationGracePeriodSeconds: 40
      containers:
        - name: sample-api
          # El tag real se fija por overlay vía kustomization.yaml -> images:
          # (dev/staging apuntan a un tag mutable de pre-release, prod exige
          # un tag inmutable versionado — ver overlays/prod/kustomization.yaml).
          image: bitcode/sample-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            # Configuración no sensible (ASPNETCORE_ENVIRONMENT, logging, etc.).
            - configMapRef:
                name: sample-api-config
            # Referencia externa: el Secret "sample-api-secrets" (cadena de
            # conexión SQL Server, Secrets:Vault:Token si aplica, etc.) NO se
            # define en este repositorio. Lo provisiona cada clúster/ambiente
            # por su propio mecanismo (External Secrets Operator contra Vault
            # -- docs/adr/0014-secretos-proveedor-vault-propuesto.md --, o
            # sealed-secrets/CI en un pipeline de despliegue con acceso al
            # secret store real). Ver overlays/*/secret.example.yaml para las
            # claves esperadas (plantilla, sin valores reales, no se aplica).
            - secretRef:
                name: sample-api-secrets
          # -----------------------------------------------------------------
          # F4-04: startupProbe / livenessProbe / readinessProbe contra los
          # endpoints de F1-25 (Shared.Infrastructure.Web, ver
          # docs/guia-health-checks.md). Los tres apuntan por nombre de puerto
          # ("http", containerPort 8080) — la imagen "chiseled" (F4-01) no
          # tiene shell/curl, así que solo httpGet es viable (no exec).
          #
          # startupProbe -> /health/live: mismo endpoint que livenessProbe, es
          # el patrón recomendado por Kubernetes para permitir un arranque
          # lento (acá, SampleDbContext.Database.EnsureCreatedAsync() en
          # Program.cs, que corre ANTES de que Kestrel empiece a escuchar)
          # sin que livenessProbe mate el contenedor a mitad de esa
          # inicialización. No depende de SQL Server/Redis (mismo Predicate
          # que descarta todos los checks) — solo confirma que el proceso
          # .NET puede responder HTTP. Da hasta 60s (30 x 2s) antes de que
          # Kubernetes considere el startup fallido y reinicie el pod; en la
          # práctica Kestrel no acepta conexiones hasta que EnsureCreatedAsync
          # termina, así que el primer intento exitoso ya implica init
          # completa.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          # livenessProbe -> /health/live: SOLO indica "el proceso .NET está
          # vivo y puede responder". Nunca evalúa SQL Server/Redis (ver
          # HealthCheckEndpointRouteBuilderExtensions, Predicate = _ => false)
          # -- una caída de una dependencia externa no crítica para el
          # proceso NO debe disparar un restart (criterio de aceptación de
          # esta fila: "sin bucles de reinicio por dependencia no crítica").
          # Reinicia el pod solo tras 3 fallos consecutivos (30s sin
          # respuesta) de un proceso que ya pasó el startupProbe.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readinessProbe -> /health/ready: SÍ refleja el estado de las
          # dependencias críticas (SQL Server siempre; Redis si el proyecto
          # configuró Caching:RedisConnectionString) -- 503 si alguna está
          # caída. Un readinessProbe fallido saca el pod del Service (deja de
          # recibir tráfico) SIN reiniciarlo -- Kubernetes solo actúa sobre
          # livenessProbe/startupProbe para reinicios.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # -----------------------------------------------------------------
          # F4-05 (Shutdown): drenar tráfico ANTES de que el proceso reciba SIGTERM. La salida de un Pod
          # del Service (kube-proxy deja de enrutarle tráfico nuevo) y el envío de SIGTERM al proceso son
          # dos eventos EN PARALELO disparados por el mismo Pod entrando en estado "Terminating" -- sin
          # este hook, un balanceador/Ingress que todavía no propagó la baja del Endpoint puede seguir
          # enviando requests nuevos a un proceso que ya dejó de escuchar (o que ya terminó). El hook
          # retrasa el envío de SIGTERM lo suficiente para que esa propagación ya haya ocurrido.
          #
          # `sleep` nativo del kubelet (acción estable desde Kubernetes 1.29, "sleep action" de
          # lifecycle hooks: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/) —
          # NO `exec` con un comando `sleep` de shell: la imagen "chiseled" (F4-01) no tiene `/bin/sh` ni
          # ningún binario de coreutils (ver docs/politica-contenedores.md sección 3.2), mismo motivo por
          # el que los tres probes de arriba son `httpGet` y nunca `exec`. El kubelet ejecuta este sleep
          # por su cuenta, sin necesitar nada dentro del contenedor.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            # Valores base conservadores; cada overlay los sobreescribe con un
            # patch acorde al perfil de carga esperado del ambiente.
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            # La imagen base ya corre non-root (UID 1654, ver
            # docs/politica-contenedores.md sección 3.4); se refuerza acá a
            # nivel Pod/Container para que el Deployment sea explícito y no
            # dependa únicamente de lo que defina la imagen.
            runAsNonRoot: true
            runAsUser: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # dotnet publish self-contained=false escribe en /tmp; revisar al habilitar F4-05 si se puede endurecer.
            capabilities:
              drop:
                - ALL
      # -------------------------------------------------------------------
      # TODO(F4-07): topologySpreadConstraints / afinidad anti-afinidad entre
      # zonas y nodos (fila F4-07, PDB y spread), fuera de alcance de F4-02.
      # -------------------------------------------------------------------
      securityContext:
        seccompProfile:
          type: RuntimeDefault

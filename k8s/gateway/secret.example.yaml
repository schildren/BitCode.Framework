# PLANTILLA -- NO es un recurso real, no se referencia desde kustomization.yaml y no se aplica con
# `kubectl apply -k`. Documenta las claves que k8s/gateway/deployment.yaml espera encontrar en el
# Secret "gateway-secrets" de cada namespace/ambiente, provisionado por un mecanismo externo al
# repositorio (nunca committeado con valores reales -- Plan Maestro sección 3.2, mismo criterio que
# k8s/sample-api/base/secret.example.yaml, F4-02).
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
type: Opaque
stringData:
  # Auth boundary (F4-08): la misma clave simétrica que emite/valida el JWT en el resto de la
  # plataforma (AddSharedSecurity/AddSharedJwtBearerAuthentication comparten la sección "Jwt") --
  # nunca committeada, provista por el secret store del ambiente real.
  Jwt__SecretKey: "<provisto externamente>"

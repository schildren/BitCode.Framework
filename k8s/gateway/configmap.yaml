apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: bitcode-framework
data:
  ASPNETCORE_HTTP_PORTS: "8080"
  ASPNETCORE_ENVIRONMENT: "Production"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  OpenTelemetry__ServiceName: "BitCode.Gateway"
  Jwt__Issuer: "BitCode.Framework"
  Jwt__Audience: "BitCode.Framework.Clients"
  RateLimiting__PermitLimit: "100"
  RateLimiting__WindowSeconds: "10"
  RateLimiting__QueueLimit: "0"
  # Routing (F4-08): destino real del cluster "sample-api-cluster" -- ClusterIP del Service
  # sample-api (k8s/sample-api/base/service.yaml), resoluble por DNS interno del cluster
  # ("sample-api.<namespace>.svc.cluster.local" o simplemente "sample-api" dentro del mismo
  # namespace). Un proyecto consumidor real agrega acá una entrada de ReverseProxy__Routes__/
  # ReverseProxy__Clusters__ por cada backend adicional que el Gateway deba exponer.
  ReverseProxy__Routes__sample-api__ClusterId: "sample-api-cluster"
  ReverseProxy__Routes__sample-api__Match__Path: "/api/{**catch-all}"
  ReverseProxy__Clusters__sample-api-cluster__Destinations__destination1__Address: "http://sample-api/"

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitCode.Framework — Portal Técnico y Documentación</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-sidebar: #090d16;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --code-bg: #030712;
      --tag-green: #10b981;
      --tag-blue: #3b82f6;
      --tag-yellow: #f59e0b;
      --tag-red: #ef4444;
      --tag-purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-version {
      font-size: 0.75rem;
      color: var(--accent);
      background-color: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: auto;
    }

    .search-box {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .nav-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(15, 23, 42, 0.4);
    }

    .nav-tab {
      flex: 1;
      padding: 0.65rem 0.25rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      user-select: none;
    }

    .nav-tab:hover {
      color: var(--text-main);
    }

    .nav-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background-color: rgba(56, 189, 248, 0.05);
    }

    .item-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }

    .list-category-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 0.75rem 0.5rem 0.25rem 0.5rem;
      font-weight: 700;
    }

    .nav-item {
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item:hover {
      background-color: var(--bg-surface);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
    }

    .item-badge {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-accepted { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-proposed { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-get { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-post { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-put { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-delete { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }

    /* Content Area */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background-color: var(--bg-primary);
    }

    .content-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(30, 41, 59, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .content-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .doc-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .markdown-body {
      padding: 2rem;
      max-width: 1000px;
      line-height: 1.7;
      color: #e2e8f0;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: #fff;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .markdown-body h2 { border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem; }
    .markdown-body p { margin-bottom: 1rem; }
    .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1rem; }
    .markdown-body li { margin-bottom: 0.25rem; }

    .code-block-wrapper {
      position: relative;
      margin: 1.25rem 0;
    }

    .code-block-wrapper pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.88rem;
      color: #e2e8f0;
    }

    .copy-button {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-button:hover {
      color: var(--text-main);
      background-color: var(--border-color);
    }

    /* OpenAPI Endpoints Table */
    .endpoint-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .endpoint-summary {
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.95rem;
      font-family: monospace;
      font-weight: 600;
    }

    .endpoint-desc {
      padding: 0.75rem 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">B</div>
      <div>
        <div class="brand-title">BitCode</div>
      </div>
      <span class="brand-version">v0.1.0</span>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar docs, ADRs, APIs, endpoints...">
    </div>

    <div class="nav-tabs">
      <div class="nav-tab active" data-tab="docs">Docs (<span id="countDocs">0</span>)</div>
      <div class="nav-tab" data-tab="adrs">ADRs (<span id="countAdrs">0</span>)</div>
      <div class="nav-tab" data-tab="apis">APIs (<span id="countApis">0</span>)</div>
      <div class="nav-tab" data-tab="examples">Ejemplos</div>
    </div>

    <div class="item-list" id="itemList">
      <!-- Items dynamically populated -->
    </div>
  </aside>

  <!-- Main Content -->
  <main class="content-area" id="contentArea">
    <div class="content-header">
      <div>
        <h1 id="viewTitle">Cargando documentación...</h1>
        <div class="doc-meta" id="viewMeta"></div>
      </div>
    </div>

    <div class="markdown-body" id="viewBody">
      <!-- Body populated -->
    </div>
  </main>

  <script>
    let portalData = { docs: [], adrs: [], openapis: [], examples: [] };
    let currentTab = 'docs';
    let currentItem = null;

    async function init() {
      try {
        const res = await fetch('portal-data.json');
        portalData = await res.json();
        
        document.getElementById('countDocs').textContent = portalData.docs.length;
        document.getElementById('countAdrs').textContent = portalData.adrs.length;
        document.getElementById('countApis').textContent = portalData.openapis.length;

        setupEvents();
        renderNavList();
        
        // Select first document by default
        if (portalData.docs.length > 0) {
          selectItem(portalData.docs[0]);
        }
      } catch (err) {
        console.error('Error loading portal data:', err);
        document.getElementById('viewTitle').textContent = 'Error al cargar los datos del portal';
        document.getElementById('viewBody').innerHTML = '<p>Asegúrese de ejecutar "node portal/build-portal.mjs" para compilar portal-data.json.</p>';
      }
    }

    function setupEvents() {
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentTab = tab.getAttribute('data-tab');
          renderNavList();
        });
      });

      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', () => {
        renderNavList(searchInput.value.trim().toLowerCase());
      });
    }

    function renderNavList(filter = '') {
      const container = document.getElementById('itemList');
      container.innerHTML = '';

      let items = [];
      if (currentTab === 'docs') items = portalData.docs;
      else if (currentTab === 'adrs') items = portalData.adrs;
      else if (currentTab === 'apis') items = portalData.openapis;
      else if (currentTab === 'examples') items = portalData.examples;

      if (filter) {
        items = items.filter(item => {
          const matchTitle = item.title?.toLowerCase().includes(filter);
          const matchContent = item.content?.toLowerCase().includes(filter);
          const matchFileName = item.fileName?.toLowerCase().includes(filter);
          const matchServiceName = item.serviceName?.toLowerCase().includes(filter);
          const matchPaths = item.paths?.some(p => p.route.toLowerCase().includes(filter) || p.summary?.toLowerCase().includes(filter));
          return matchTitle || matchContent || matchFileName || matchServiceName || matchPaths;
        });
      }

      if (items.length === 0) {
        container.innerHTML = '<div class="empty-state">No se encontraron resultados</div>';
        return;
      }

      // Grouping
      let currentCategory = '';
      items.forEach(item => {
        const itemCategory = item.category || (item.type === 'adr' ? 'Architecture Decision Records' : (item.type === 'openapi' ? 'Especificaciones OpenAPI' : 'General'));
        
        if (itemCategory !== currentCategory && currentTab !== 'apis') {
          currentCategory = itemCategory;
          const catTitle = document.createElement('div');
          catTitle.className = 'list-category-title';
          catTitle.textContent = currentCategory;
          container.appendChild(catTitle);
        }

        const el = document.createElement('div');
        el.className = 'nav-item' + (currentItem && currentItem.id === item.id ? ' active' : '');
        
        let badgeHtml = '';
        if (item.type === 'adr') {
          const statusCls = item.status.toLowerCase().includes('accept') ? 'badge-accepted' : 'badge-proposed';
          badgeHtml = `<span class="item-badge ${statusCls}">${item.status}</span>`;
        } else if (item.type === 'openapi') {
          badgeHtml = `<span class="item-badge badge-accepted">${item.endpointCount} eps</span>`;
        }

        el.innerHTML = `
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(item.title || item.serviceName)}</span>
          ${badgeHtml}
        `;

        el.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          el.classList.add('active');
          selectItem(item);
        });

        container.appendChild(el);
      });
    }

    function selectItem(item) {
      currentItem = item;
      const titleEl = document.getElementById('viewTitle');
      const metaEl = document.getElementById('viewMeta');
      const bodyEl = document.getElementById('viewBody');

      titleEl.textContent = item.title || item.serviceName;
      metaEl.innerHTML = '';
      bodyEl.innerHTML = '';

      if (item.type === 'doc') {
        metaEl.innerHTML = `<span>Categoría: <strong>${item.category}</strong></span> <span>Archivo: <code>${item.fileName}</code></span>`;
        bodyEl.innerHTML = renderMarkdown(item.content);
      } else if (item.type === 'adr') {
        metaEl.innerHTML = `
          <span>Número: <strong>#${item.number}</strong></span>
          <span>Estado: <strong>${item.status}</strong></span>
          ${item.date ? `<span>Fecha: ${item.date}</span>` : ''}
          <span>Archivo: <code>${item.fileName}</code></span>
        `;
        bodyEl.innerHTML = renderMarkdown(item.content);
      } else if (item.type === 'openapi') {
        metaEl.innerHTML = `
          <span>Servicio: <strong>${item.serviceName}</strong></span>
          <span>Versión API: <strong>${item.specVersion}</strong></span>
          <span>Total Endpoints: <strong>${item.endpointCount}</strong></span>
        `;
        renderOpenApiView(item, bodyEl);
      } else if (item.type === 'example') {
        metaEl.innerHTML = `<span>Categoría: <strong>${item.category}</strong></span>`;
        bodyEl.innerHTML = `
          <p>${escapeHtml(item.description)}</p>
          <div class="code-block-wrapper">
            <button class="copy-button" onclick="copyCode(this)">Copiar</button>
            <pre><code>${escapeHtml(item.code)}</code></pre>
          </div>
        `;
      }

      // Scroll content to top
      document.getElementById('contentArea').scrollTop = 0;
    }

    function renderOpenApiView(api, container) {
      if (!api.paths || api.paths.length === 0) {
        container.innerHTML = '<p>No se encontraron rutas expuestas en esta especificación.</p>';
        return;
      }

      let html = `<p>${escapeHtml(api.description || 'Catálogo de endpoints expuestos por este servicio.')}</p><br/>`;

      api.paths.forEach(ep => {
        const methodCls = 'badge-' + ep.method.toLowerCase();
        html += `
          <div class="endpoint-card">
            <div class="endpoint-summary">
              <span class="item-badge ${methodCls}">${ep.method}</span>
              <span>${escapeHtml(ep.route)}</span>
            </div>
            ${ep.summary ? `<div class="endpoint-desc">${escapeHtml(ep.summary)}</div>` : ''}
          </div>
        `;
      });

      html += `<h2 style="margin-top: 2rem;">Especificación JSON Cruda</h2>
        <div class="code-block-wrapper">
          <button class="copy-button" onclick="copyCode(this)">Copiar JSON</button>
          <pre><code>${escapeHtml(JSON.stringify(api.rawSpec, null, 2))}</code></pre>
        </div>`;

      container.innerHTML = html;
    }

    function renderMarkdown(md) {
      if (!md) return '';
      let html = md;

      // Escape code blocks first to protect them
      const codeBlocks = [];
      html = html.replace(/```([a-zA-Z0-9_-]*)\r?\n([\s\S]*?)```/g, (match, lang, code) => {
        const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
        codeBlocks.push({ lang, code });
        return placeholder;
      });

      // Headers
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

      // Bold & Italic
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Lists
      html = html.replace(/^\s*-\s+(.*$)/gim, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

      // Paragraphs
      html = html.split('\n\n').map(p => {
        p = p.trim();
        if (p.startsWith('<h') || p.startsWith('<ul') || p.startsWith('<li') || p.startsWith('__CODE_BLOCK_')) {
          return p;
        }
        return `<p>${p}</p>`;
      }).join('\n');

      // Restore code blocks with copy button
      codeBlocks.forEach((block, idx) => {
        const placeholder = `__CODE_BLOCK_${idx}__`;
        const blockHtml = `
          <div class="code-block-wrapper">
            <button class="copy-button" onclick="copyCode(this)">Copiar</button>
            <pre><code class="language-${block.lang}">${escapeHtml(block.code)}</code></pre>
          </div>
        `;
        html = html.replace(placeholder, blockHtml);
      });

      return html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.copyCode = function(button) {
      const code = button.nextElementSibling.querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        const originalText = button.textContent;
        button.textContent = '¡Copiado!';
        button.style.backgroundColor = '#10b981';
        button.style.color = '#fff';
        setTimeout(() => {
          button.textContent = originalText;
          button.style.backgroundColor = '';
          button.style.color = '';
        }, 2000);
      });
    };

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
